name: Validate

on:
  pull_request:
  push:
    branches: [main, setup/vivia-velora-foundation, feat/velora-core-logic]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.mjs
      - run: npm pack --dry-run
